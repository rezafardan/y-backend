# CATATAN CI/CD: daftar di bawah adalah dependency native yang butuh compile
# (postinstall script) — bcrypt & sharp perlu native binding, prisma perlu
# generate client. Kalau nanti nambah dependency native baru dan container
# tiba-tiba error "Cannot find module .../binding/..." atau
# "ERR_PNPM_IGNORED_BUILDS", kemungkinan besar dependency itu belum
# didaftarkan di sini — pnpm versi baru menolak menjalankan build script
# yang belum di-allow secara eksplisit (langkah keamanan supply-chain).
onlyBuiltDependencies:
  - sharp
  - bcrypt
  - prisma
  - "@prisma/client"
  - "@prisma/engines"

allowBuilds:
  sharp: true
  bcrypt: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true